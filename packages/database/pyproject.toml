[project]
name = "fastforge-database"
version = "0.1.0"
description = "Database foundation for FastForge"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastforge_database"]

[tool.hatch.build.targets.sdist]
include = ["src/fastforge_database", "migrations", "alembic.ini"]
