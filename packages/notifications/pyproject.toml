[project]
name = "fastforge-notifications"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastforge-common", "fastforge-mail"]

[tool.uv.sources]
fastforge-common = { workspace = true }
fastforge-mail = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastforge_notifications"]
