[project]
name = "fastforge-logging"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastforge-common"]

[tool.uv.sources]
fastforge-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastforge_logging"]
