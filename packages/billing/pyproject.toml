[project]
name = "fastforge-billing"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastforge-database", "fastforge-common"]

[tool.uv.sources]
fastforge-database = { workspace = true }
fastforge-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastforge_billing"]
