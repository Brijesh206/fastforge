<h1 style="margin:0 0 12px;font-size:22px;">Reset your password</h1>
<p style="margin:0 0 24px;line-height:1.5;">
  We received a request to reset the password for your $product_name account.
</p>
<p style="margin:0 0 24px;">
  <a
    href="$action_url"
    style="display:inline-block;background:#1f2430;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;"
    >Reset password</a
  >
</p>
<p style="margin:0 0 24px;font-size:13px;color:#6b7280;line-height:1.5;">
  Or paste this link into your browser:<br />
  <span style="word-break:break-all;">$action_url</span>
</p>
<p style="margin:0;font-size:13px;color:#6b7280;line-height:1.5;">
  This link expires in $expires_in. If you did not request a reset, ignore this email — your
  password will not change.
</p>
