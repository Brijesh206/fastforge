[project]
name = "fastforge-mail"
version = "0.1.0"
description = "Transactional email for FastForge"
requires-python = ">=3.13"
dependencies = [
    "fastforge-common",
    "fastforge-logging",
    "fastforge-jobs",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[tool.uv.sources]
fastforge-common = { workspace = true }
fastforge-logging = { workspace = true }
fastforge-jobs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastforge_mail"]
