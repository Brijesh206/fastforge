[project]
name = "fastforge-auth"
version = "0.1.0"
description = "Authentication for FastForge"
requires-python = ">=3.13"
dependencies = [
    "fastforge-database",
    "fastforge-common",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
]

[tool.uv.sources]
fastforge-database = { workspace = true }
fastforge-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastforge_auth"]
