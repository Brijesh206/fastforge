name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastforge_platform_test
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastforge_platform_test

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastforge_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check
        run: >-
          uv run mypy
          packages/common/src
          packages/logging/src
          packages/database/src
          packages/auth/src
          packages/mail/src
          packages/billing/src

      - name: Run tests
        run: uv run pytest -m "not integration" packages

      - name: Run integration tests
        # Exit code 5 = "no tests collected". There are no integration-marked
        # tests yet, which must not fail the pipeline; any real failure still does.
        run: uv run pytest -m integration packages || [ "$?" -eq 5 ]

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `next build` runs ESLint and TypeScript type-checking, so this one step
      # covers lint, types, and a production compile.
      - name: Build web app
        run: pnpm --filter @fastforge/web build
