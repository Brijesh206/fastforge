name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastforge_platform_test
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastforge_platform_test

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastforge_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check
        run: >-
          uv run mypy
          packages/common/src
          packages/logging/src
          packages/database/src
          packages/auth/src
          packages/mail/src
          packages/billing/src

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --all-packages --format requirements-txt --no-emit-workspace --no-hashes > /tmp/requirements.txt
          uv tool run pip-audit -r /tmp/requirements.txt --disable-pip --no-deps

      - name: Run tests
        run: uv run pytest -m "not integration" packages

      - name: Run integration tests
        # These need the service containers above. The old "exit 5 is fine"
        # guard is gone: integration tests exist now, so collecting none means
        # they stopped being discovered, which should fail rather than pass.
        run: uv run pytest -m integration packages

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for known vulnerabilities
        run: pnpm audit --prod --audit-level moderate

      # `next build` runs ESLint and TypeScript type-checking, so this one step
      # covers lint, types, and a production compile.
      - name: Build web app
        run: pnpm --filter @fastforge/web build
