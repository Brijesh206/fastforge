# Local development backing services only — Postgres, Redis, Mailpit.
#
#   docker compose up -d
#
# The API and web app deliberately run on the host (`uv run uvicorn ... --reload`
# and `pnpm --filter @fastforge/web dev`) rather than in containers: hot reload
# through a bind mount is markedly slower, and you want a debugger attached.
# For the containerized full stack, that's docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: fastforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastforge_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastforge_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: fastforge-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
