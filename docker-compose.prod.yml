# Production stack for a single VPS (~1 vCPU / 1GB is enough — the web app runs
# on Vercel and Postgres is Supabase, so only the API + Caddy live here).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires a .env alongside this file (see .env.production.example) and DNS
# A-record for $API_DOMAIN pointing at this host.
services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: fastforge-api:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
