[project]
name = "fastforge-api"
version = "0.1.0"
description = "FastAPI application for FastForge"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "fastforge-database",
    "fastforge-common",
    "fastforge-logging",
]

[tool.uv.sources]
fastforge-database = { workspace = true }
fastforge-common = { workspace = true }
fastforge-logging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
fastforge-api = "app.main:run"
