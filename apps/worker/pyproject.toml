[project]
name = "fastforge-worker"
version = "0.1.0"
description = "Background worker for FastForge"
requires-python = ">=3.13"
dependencies = [
    # Both backends, so a buyer can switch JOBS_PROVIDER without reinstalling.
    "fastforge-jobs[taskiq,celery]",
    "fastforge-mail",
    "fastforge-common",
    "fastforge-logging",
    "fastforge-database",
]

[tool.uv.sources]
fastforge-jobs = { workspace = true }
fastforge-mail = { workspace = true }
fastforge-common = { workspace = true }
fastforge-logging = { workspace = true }
fastforge-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_app"]

[project.scripts]
fastforge-worker = "worker_app.main:main"
