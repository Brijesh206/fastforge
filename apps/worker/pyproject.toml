[project]
name = "fastforge-worker"
version = "0.1.0"
description = "Celery worker for FastForge"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4",
    "fastforge-database",
    "fastforge-common",
]

[tool.uv.sources]
fastforge-database = { workspace = true }
fastforge-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_app"]
